server:
  port: 8084

spring:
  application:
    name: analytics-service
  datasource:
    url: jdbc:postgresql://localhost:5432/adherelens?currentSchema=analytics
    username: ${DB_USER:adherelens}
    password: ${DB_PASSWORD}
  flyway:
    schemas: analytics
    default-schema: analytics
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: analytics-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

adherelens:
  jwt:
    secret: ${JWT_SECRET}
  internal:
    api-key: ${INTERNAL_API_KEY}
  clinical:
    base-url: ${CLINICAL_BASE_URL:http://localhost:8082}
  analytics:
    # Hospital time zone, used to count "day of therapy".
    zone: Asia/Kolkata
    # Any group with fewer distinct patients than this is hidden in every result.
    min-group-size: 5
    # Keyed-hash secret for patient pseudonyms and blinded hospital labels. Required: set it in .env (see .env.example).
    pseudonym-secret: ${PSEUDONYM_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
