server:
  port: 8082

spring:
  application:
    name: clinical-service
  datasource:
    url: jdbc:postgresql://localhost:5432/adherelens
    username: ${DB_USER:adherelens}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: clinical
  flyway:
    schemas: clinical
    default-schema: clinical
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false

adherelens:
  jwt:
    secret: ${JWT_SECRET}
  dose:
    # Hospital time zone used to turn "08:00" dose times into exact instants.
    zone: Asia/Kolkata
    # A response within this many minutes of the due time counts as HIT; later is DELAYED.
    on-time-minutes: 15
  internal:
    # Shared key for service-to-service calls (notification-service reads patient contacts).
    api-key: ${INTERNAL_API_KEY}
  dose-link:
    # Signs the one-time dose links sent to outpatients. At least 32 characters, separate from JWT_SECRET.
    secret: ${DOSE_LINK_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
