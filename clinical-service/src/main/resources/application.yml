server:
  port: 8082

spring:
  application:
    name: clinical-service
  datasource:
    url: jdbc:postgresql://localhost:5432/adherelens
    username: adherelens
    password: adherelens
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: clinical
  flyway:
    schemas: clinical
    default-schema: clinical
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false

adherelens:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-any-real-use-0123456789}
  dose:
    # Hospital time zone used to turn "08:00" dose times into exact instants.
    zone: Asia/Kolkata
    # A response within this many minutes of the due time counts as HIT; later is DELAYED.
    on-time-minutes: 15
