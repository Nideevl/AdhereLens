server:
  port: 8083

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/adherelens
    username: adherelens
    password: adherelens
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: notification
  flyway:
    schemas: notification
    default-schema: notification
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      # Read from the start the first time, so doses published before this service existed are seen.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

adherelens:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-any-real-use-0123456789}
  notification:
    # Outpatient reminders: minutes after the due time. Only attempts that fall before the
    # window closes are created, so the follow-ups are always bounded.
    outpatient-offsets-minutes: 0,15,30
