server:
  port: 8083

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/adherelens
    username: ${DB_USER:adherelens}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: notification
  flyway:
    schemas: notification
    default-schema: notification
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      # Read from the start the first time, so doses published before this service existed are seen.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

adherelens:
  jwt:
    secret: ${JWT_SECRET}
  internal:
    # Shared key for calling clinical-service's /internal endpoints. Must match its api-key.
    api-key: ${INTERNAL_API_KEY}
  clinical:
    base-url: ${CLINICAL_BASE_URL:http://localhost:8082}
  notification:
    # Base address patients open from the SMS link. Must be reachable from their phone.
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
    # Outpatient reminders as "minutes after due time:channel". Only attempts that fall before
    # the window closes are created, so the follow-ups are always bounded.
    outpatient-schedule: "0:SMS,15:SMS,30:CALL"
    retry:
      # A failed send is retried with backoff (30s, 60s, ...) until max-tries or the dose window closes.
      max-tries: 3
      base-delay-seconds: 30
      # A reminder claimed for longer than this is assumed lost with a crashed instance and is released.
      claim-lease-seconds: 120
  twilio:
    # false = log only, nothing is sent. true = real texts and calls through Twilio.
    enabled: false
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
    # Added to numbers stored without a leading +.
    default-country-code: ${TWILIO_DEFAULT_COUNTRY_CODE:+91}
    base-url: https://api.twilio.com

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
