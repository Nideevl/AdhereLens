server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/adherelens
    username: ${DB_USER:adherelens}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: identity
  flyway:
    schemas: identity
    default-schema: identity

adherelens:
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: 480
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@adherelens.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
