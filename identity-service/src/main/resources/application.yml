server:
  port: 8081

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:postgresql://localhost:5432/adherelens
    username: adherelens
    password: adherelens
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: identity
  flyway:
    schemas: identity
    default-schema: identity

adherelens:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-any-real-use-0123456789}
    expiry-minutes: 480
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@adherelens.local}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:ChangeMe123!}
